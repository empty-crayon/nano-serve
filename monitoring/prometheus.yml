global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8765"]
    metrics_path: /metrics

  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics