# NanoServe sits behind this nginx load balancer.
# nginx listens on :8780 (public) and round-robins to NanoServe worker(s) on :8765.
#
# Start:  nginx -p /tmp -c "$(pwd)/monitoring/nginx-gateway-lb.conf"   (from nano-serve/)
# Stop:   nginx -p /tmp -s stop
#
# NanoServe default: host=127.0.0.1 port=8765  (NANOSERVE_HOST / NANOSERVE_PORT to override)
# To run two workers add a second server line and start a second process with NANOSERVE_PORT=8766.

worker_processes  1;
error_log  /tmp/nginx-gateway-lb.error.log  warn;
pid        /tmp/nginx-gateway-lb.pid;

events {
    worker_connections  1024;
}

http {
    upstream gateway {
        server 127.0.0.1:8765;
        # server 127.0.0.1:8766;
    }

    server {
        listen 8780;
        server_name  _;

        client_max_body_size 64m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }
    }
}
