[project]
name = "nanoserve"
version = "1.0.0"
description = "LLM inference gateway: OpenAI-compatible, streaming SSE, per-request Prometheus metrics, Grafana observability stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.131.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.22.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
